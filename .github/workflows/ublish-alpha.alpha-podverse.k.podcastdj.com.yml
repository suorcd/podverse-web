name: aplpha-podverse.k.podcastdj.com Publish

on:
  push:
    branches:
      - v5-alpha.alpha-podverse.k.podcastdj.com

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install podverse-helpers latest alpha version
        run: npm i podverse-helpers@alpha --save

      - name: Clean install dependencies
        run: npm clean-install

      - name: Determine next alpha version
        id: version
        env:
          # Pass the GitHub Run Number (Job Number) to the script environment
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(echo "$BASE_VERSION" | sed 's/-.*//')

          OWNER="${{ secrets.GHCR_OWNER }}"
          if [[ -z "$OWNER" ]]; then
            OWNER="$GITHUB_ACTOR"
          fi
          IMAGE_NAME=ghcr.io/$OWNER/podverse-web

          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          TAGS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${{ github.actor }}/podverse-web/tags/list")
          echo "Raw tags JSON: $TAGS_JSON"
          TAGS=$(echo "$TAGS_JSON" | jq -r '.tags[]' | grep "alpha" || true)
          echo "Filtered alpha tags: $TAGS"

          ALPHA_VERSION=$(echo "$TAGS" | grep "^${BASE_VERSION}-alpha\." | sort -V | tail -n1)
          echo "Latest alpha version for base $BASE_VERSION: $ALPHA_VERSION"

          if [[ -z "$ALPHA_VERSION" ]]; then
            echo "No alpha version found. Starting with: $BASE_VERSION-alpha.0"
            NEXT_VERSION="$BASE_VERSION-alpha.0"
          else
            CURRENT_BASE=$(echo "$ALPHA_VERSION" | cut -d '-' -f 1)
            
            # UPDATED REGEX: Changed to allow characters after the alpha number
            # This ensures we can parse 'alpha.3-88' and still extract '3'
            CURRENT_ALPHA_NUM=$(echo "$ALPHA_VERSION" | sed -En 's/.*alpha\.([0-9]+).*$/\1/p')

            if [[ -z "$CURRENT_ALPHA_NUM" ]]; then
              NEXT_VERSION="$BASE_VERSION-alpha.0"
            elif [[ "$CURRENT_BASE" == "$BASE_VERSION" ]]; then
              NEXT_INDEX=$((CURRENT_ALPHA_NUM + 1))
              NEXT_VERSION="$BASE_VERSION-alpha.$NEXT_INDEX"
              echo "Same base version detected. Incrementing alpha to: $NEXT_VERSION"
            else
              NEXT_VERSION="$BASE_VERSION-alpha.0"
              echo "New base version detected. Resetting alpha to: $NEXT_VERSION"
            fi
          fi

          # Append the Job/Run Number to the final version string here
          FINAL_VERSION="$NEXT_VERSION-$RUN_NUMBER"

          echo "NEXT_VERSION=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "OWNER=$OWNER" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build . -t ghcr.io/${{ steps.version.outputs.OWNER }}/podverse-web:${{ steps.version.outputs.NEXT_VERSION }}

      - name: Build second Docker image from Dockerfile.build.alpha-podverse.k.podcastdj.com with Podverse env vars
        run: |
          docker build . -f ./Dockerfile.build.alpha-podverse.k.podcastdj.com -t ghcr.io/${{ steps.version.outputs.OWNER }}/podverse-web-deploy:${{ steps.version.outputs.NEXT_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ steps.version.outputs.OWNER }}/podverse-web:${{ steps.version.outputs.NEXT_VERSION }}

      - name: Push second Docker image
        run: |
          docker push ghcr.io/${{ steps.version.outputs.OWNER }}/podverse-web-deploy:${{ steps.version.outputs.NEXT_VERSION }}
